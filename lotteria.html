<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotteria — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2C0943">
<link rel="icon" href="assets/img/logo-growmi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{ --purple-deep:#3E0D5D; --purple-deeper:#2C0943; --coral:#F86639; --yellow:#FDC631; --cream:#FBF6F0; --ink:#1E0C2C; --grey:#6E6478; --line:#E6DED3; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    line-height:1.6; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; padding:40px 20px; text-align:center;
  }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; margin-bottom:10px; }
  .logo{ height:32px; margin-bottom:24px; }
  .card{ width:100%; max-width:440px; background:#fff; border-radius:24px; padding:36px 28px; box-shadow:0 20px 50px rgba(30,12,44,0.1); }
  p{ font-size:14.5px; color:var(--grey); }
  .price{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; color:var(--coral); margin:18px 0; }
  form{ text-align:left; margin-top:20px; display:flex; flex-direction:column; gap:12px; }
  label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Inter',sans-serif; font-size:15px; margin-top:4px;
  }
  input:focus{ outline:none; border-color:var(--coral); }
  button{
    margin-top:8px; padding:15px; border:none; border-radius:12px; background:var(--coral);
    color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  #lt-status{ font-size:13px; color:var(--coral); margin-top:10px; }
  #lt-checkout{ margin-top:20px; text-align:left; }
  .prizes{ background:var(--cream); border-radius:14px; padding:16px 18px; margin:18px 0 4px; text-align:left; }
  .prizes h2{ font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--coral); margin-bottom:8px; }
  .prizes ul{ list-style:none; font-size:14px; color:var(--ink); }
  .prizes li{ padding:3px 0; }
  .packs{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
  .pack{ position:relative; display:block; cursor:pointer; margin:0; }
  .pack input{ position:absolute; opacity:0; width:0; height:0; margin:0; }
  .pack span{ display:flex; flex-direction:column; align-items:center; gap:2px; border:1.5px solid var(--line); border-radius:14px; padding:12px 6px 10px; background:#fff; text-align:center; font-weight:600; font-size:13px; color:var(--ink); }
  .pack span b{ font-family:'Space Grotesk',sans-serif; font-size:22px; line-height:1.1; }
  .pack span em{ font-style:normal; font-weight:700; font-size:15px; color:var(--coral); font-family:'Space Grotesk',sans-serif; }
  .pack span i{ font-style:normal; font-size:11px; color:var(--grey); font-weight:500; min-height:14px; }
  .pack input:checked + span{ border-color:var(--coral); background:#FFF3EE; box-shadow:0 0 0 2px rgba(248,102,57,.18); }
  .pack input:focus-visible + span{ outline:2px solid var(--purple-deeper); outline-offset:2px; }
  .total{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; margin-top:2px; }
  .check{ display:flex; gap:10px; align-items:flex-start; font-weight:500; font-size:13px; color:var(--grey); }
  .check input{ width:auto; margin-top:3px; }
  .check a{ color:var(--coral); }
</style>
</head>
<body>

<img class="logo" src="assets/img/logo-growmi.png" alt="GrowMi">
<div class="card">
  <h1>Lotteria GrowMi</h1>
  <p>Partecipa e prova a vincere i premi in palio. Ogni numero costa 3€, e prendendone di più conviene.</p>
  <div class="price">€3 <small style="font-size:16px; font-weight:600; color:var(--grey);">a numero</small></div>

  <div class="prizes">
    <h2>In palio</h2>
    <ul>
      <li>👕 <strong>2 longsleeve</strong>, per il 1° e il 2° posto: una personalizzata GrowMi e una classica</li>
      <li>🔑 <strong>Un accessorio</strong> (portachiavi)</li>
    </ul>
  </div>

  <form id="lt-form">
    <div>
      <label for="lt-name">Nome e cognome</label>
      <input type="text" id="lt-name" autocomplete="name" placeholder="Nome e cognome (es. Mario Rossi)" required>
    </div>
    <div>
      <label for="lt-email">Email</label>
      <input type="email" id="lt-email" autocomplete="email" required>
    </div>
    <div>
      <label for="lt-code">Codice omaggio (facoltativo)</label>
      <input type="text" id="lt-code" autocomplete="off" autocapitalize="characters">
    </div>
    <div>
      <label for="lt-phone">Telefono (facoltativo)</label>
      <input type="tel" id="lt-phone" autocomplete="tel">
    </div>
    <div>
      <label>Scegli il pacchetto</label>
      <div class="packs" role="radiogroup" aria-label="Pacchetto di numeri">
        <label class="pack"><input type="radio" name="lt-pack" value="1" checked><span><b>1</b>numero<em>3 €</em><i>&nbsp;</i></span></label>
        <label class="pack"><input type="radio" name="lt-pack" value="3"><span><b>3</b>numeri<em>8 €</em><i>conviene</i></span></label>
        <label class="pack"><input type="radio" name="lt-pack" value="5"><span><b>5</b>numeri<em>12 €</em><i>il più conveniente</i></span></label>
      </div>
      <p class="total" id="lt-total" style="margin-top:10px;">Totale: €3</p>
    </div>
    <label class="check"><input type="checkbox" id="lt-privacy" required> <span>Ho letto l'<a href="/privacy-policy" target="_blank" rel="noopener">informativa privacy</a> e accetto che i miei dati siano usati per la lotteria.</span></label>
    <button type="submit" id="lt-submit">Continua al pagamento</button>
    <p id="lt-status" hidden></p>
  </form>

  <div id="lt-checkout" hidden></div>
</div>

<script>
(function(){
  var STRIPE_PUBLISHABLE_KEY = "pk_live_51RCPfzAlS0d4FgrwKgoxmfFsPUx1a7pAwn5707zCQ9PhmQYHJ41Ji4sXJt60YpD4IuDkEpUZwZe5YKRMz1lKJxbH00hrAkWQYt";
  var PACKS = { 1: 3, 3: 8, 5: 12 };
  var qty = 1;
  var form = document.getElementById('lt-form');
  var submitBtn = document.getElementById('lt-submit');
  var status = document.getElementById('lt-status');
  var checkoutWrap = document.getElementById('lt-checkout');

  function renderTotal(){
    document.getElementById('lt-total').textContent = 'Totale: €' + PACKS[qty];
  }
  document.querySelectorAll('input[name="lt-pack"]').forEach(function(r){
    r.addEventListener('change', function(){ qty = parseInt(r.value, 10); renderTotal(); });
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if (document.getElementById('lt-name').value.trim().split(/\s+/).filter(Boolean).length < 2) {
      status.textContent = 'Scrivi nome e cognome, servono per consegnare il premio.';
      status.hidden = false;
      return;
    }
    submitBtn.disabled = true;
    status.hidden = true;
    try {
      var regRes = await fetch('/api/lottery-register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('lt-name').value.trim(),
          email: document.getElementById('lt-email').value.trim(),
          phone: document.getElementById('lt-phone').value.trim(),
          quantity: qty,
          couponCode: document.getElementById('lt-code').value.trim(),
          privacyAccepted: document.getElementById('lt-privacy').checked
        })
      });
      var regData = await regRes.json();
      if (!regRes.ok) throw new Error(regData.error || 'Errore nella registrazione');

      if (regData.free) { window.location.href = '/lotteria-confermata?session_id=' + encodeURIComponent(regData.sessionId); return; }

      var sessRes = await fetch('/api/create-lottery-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ registrationId: regData.registrationId })
      });
      var sessData = await sessRes.json();
      if (!sessRes.ok) throw new Error(sessData.error || 'Errore nella creazione del pagamento');

      form.hidden = true;
      checkoutWrap.hidden = false;
      var stripe = window.Stripe(STRIPE_PUBLISHABLE_KEY);
      var checkout = await stripe.initEmbeddedCheckout({ clientSecret: sessData.clientSecret });
      checkout.mount(checkoutWrap);
    } catch (err) {
      status.textContent = err.message || 'Errore di connessione, riprova.';
      status.hidden = false;
      submitBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
